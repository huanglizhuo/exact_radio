# /etc/nginx/conf.d/airwave.conf —— root 指向 dist 目录
server {
  listen 80;
  server_name airwave.example.com;
  root /var/www/airwave/dist;

  # 有文件就发文件；其余（深链）交给 shell.html，由客户端路由画出对应页面
  location / {
    try_files $uri /shell.html;
  }

  # 带 hash 的静态资源可以长缓存
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  types {
    application/javascript js mjs;
    application/json json;
    image/png png;
    text/css css;
  }
  gzip on;
  gzip_types application/javascript application/json text/css image/svg+xml;
}
